<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fast, private, keyboard-first JSON and JSONL viewer. Nothing leaves your browser." />
    <title>JSON Viewer</title>
    <script>
      // Apply the theme before first paint to avoid a light flash. Mirrors src/store/useThemeStore.ts.
      (() => {
        var theme = null;
        try {
          theme = localStorage.getItem("json-viewer:theme");
        } catch (_) {}
        var dark =
          theme === "dark" ||
          (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
